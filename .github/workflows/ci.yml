name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,lightgbm]
      - name: Run tests
        run: pytest -q --basetemp .pytest-tmp-ci
      - name: Compile package
        run: python -m compileall src tests
      - name: Check release gates
        run: ids-cli check-release --summary reports/release/summary.json --metrics-only
